<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV duplicate check</title><style>body{margin:0;background:#f4f6fb;color:#17213f;font:16px system-ui,sans-serif}main{max-width:580px;margin:48px auto;padding:32px;background:#fff;border-radius:16px;box-shadow:0 6px 28px #17213f18}h1{margin-top:0}label{display:block;font-weight:650;margin:20px 0 7px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd2e3;border-radius:8px;font:inherit}button{width:100%;margin-top:24px;border:0;border-radius:8px;padding:12px 18px;background:#1f4ec9;color:#fff;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.muted{color:#64748b;font-size:14px;line-height:1.5}#result{margin-top:18px;padding:12px;border-radius:8px;background:#eef4ff;white-space:pre-wrap;display:none}.error{background:#fee2e2!important;color:#991b1b}a{color:#1f4ec9}</style></head><body><main><a href="{% url 'audio:collect' %}">&larr; Audio submission</a><h1>Send CSV to n8n</h1><p class="muted">The CSV is normalized before it is sent to n8n. n8n then checks every row against your database and returns the result here.</p><p class="muted">Webhook: {{ webhook_url }}</p><form id="csv-form">{% csrf_token %}<label for="csv-file">CSV file</label><input id="csv-file" type="file" accept=".csv,text/csv" required><button id="send" type="submit">Normalize and send CSV</button></form><div id="result" aria-live="polite"></div><script>const form=document.querySelector('#csv-form'),file=document.querySelector('#csv-file'),button=document.querySelector('#send'),result=document.querySelector('#result'),csrf=document.querySelector('[name=csrfmiddlewaretoken]').value;function show(message,error=false){result.textContent=message;result.className=error?'error':'';result.style.display='block'}form.addEventListener('submit',async event=>{event.preventDefault();if(!file.files[0])return;button.disabled=true;button.textContent='Normalizing and sending...';result.style.display='none';try{const data=new FormData();data.append('data',file.files[0],file.files[0].name);const response=await fetch('{% url "audio:forward_csv_to_n8n" %}',{method:'POST',headers:{'X-CSRFToken':csrf},body:data});const raw=await response.text();let payload;try{payload=JSON.parse(raw)}catch(_){payload=raw}if(!response.ok)throw new Error(typeof payload==='string'?payload:JSON.stringify(payload));const message=typeof payload==='string'?payload:JSON.stringify(payload,null,2);show(message);alert('n8n response:\n'+message)}catch(error){show(error.message,true)}finally{button.disabled=false;button.textContent='Normalize and send CSV'}});</script></main></body></html>
