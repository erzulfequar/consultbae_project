<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit audio</title>
  <style>
    body { margin: 0; background: #f4f6fb; font: 16px system-ui, sans-serif; color: #17213f; }
    main { max-width: 560px; margin: 48px auto; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 6px 28px #17213f18; }
    h1 { margin-top: 0; } label { display: block; font-weight: 650; margin: 20px 0 7px; }
    input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #cbd2e3; border-radius: 8px; font: inherit; }
    button { border: 0; border-radius: 8px; padding: 12px 18px; font: inherit; font-weight: 650; cursor: pointer; }
    #record { background: #e8ecf7; color: #17213f; } #submit { width: 100%; margin-top: 24px; background: #1f4ec9; color: white; }
    #record.recording { background: #be123c; color: white; } #status { min-height: 24px; color: #4b5563; }
    audio { width: 100%; margin-top: 12px; } .or { text-align: center; margin: 16px 0; color: #64748b; }
  </style>
</head>
<body><main>
  <h1>Audio submission</h1><p>Record a short response or upload an audio file. <a href="{% url 'audio:submissions' %}">View submitted audios</a> · <a href="{% url 'audio:csv_to_n8n' %}">Send CSV to n8n</a></p>
  <form method="post" enctype="multipart/form-data" id="audio-form">{% csrf_token %}
    <label for="name">Full name</label><input id="name" name="name" required maxlength="255" autocomplete="name">
    <label for="phone">Phone number</label><input id="phone" name="phone" required inputmode="tel" placeholder="10-digit mobile number" autocomplete="tel">
    <label>Record in browser</label><button type="button" id="record">Start recording</button>
    <p id="status" aria-live="polite"></p><audio id="preview" controls hidden></audio>
    <p class="or">or upload an audio file</p><input id="file" type="file" name="audio" accept="audio/*">
    <input type="hidden" name="duration_seconds" id="duration"><input type="hidden" name="bitrate_kbps" id="bitrate"><input type="hidden" name="sample_rate_hz" id="sample-rate"><input type="hidden" name="channels" id="channels"><input type="hidden" name="loudness_dbfs" id="loudness"><input type="hidden" name="noise_floor_dbfs" id="noise-floor">
    <button id="submit" type="submit">Submit audio</button>
  </form>
  <script>
    const form = document.querySelector('#audio-form'), record = document.querySelector('#record'), file = document.querySelector('#file'), status = document.querySelector('#status'), preview = document.querySelector('#preview'), submit = document.querySelector('#submit');
    const fields = {duration: document.querySelector('#duration'), bitrate: document.querySelector('#bitrate'), sampleRate: document.querySelector('#sample-rate'), channels: document.querySelector('#channels'), loudness: document.querySelector('#loudness'), noise: document.querySelector('#noise-floor')};
    let recorder, chunks = [];
    let analysisPromise = Promise.resolve();
    function withTimeout(promise, milliseconds) {
      return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('Analysis timed out')), milliseconds))]);
    }
    async function analyse(audioFile) {
      const url = URL.createObjectURL(audioFile), element = new Audio(url);
      try { await withTimeout(new Promise((resolve) => { element.onloadedmetadata = resolve; element.onerror = resolve; }), 5000); } catch (_) { /* Server analysis remains the fallback. */ }
      const duration = element.duration;
      if (Number.isFinite(duration) && duration > 0) { fields.duration.value = duration.toFixed(3); fields.bitrate.value = ((audioFile.size * 8 / duration) / 1000).toFixed(1); }
      try {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const buffer = await withTimeout(context.decodeAudioData(await audioFile.arrayBuffer()), 8000);
        fields.sampleRate.value = buffer.sampleRate; fields.channels.value = buffer.numberOfChannels;
        const samples = buffer.getChannelData(0), windows = []; let total = 0;
        for (let i = 0; i < samples.length; i += 2048) { let sum = 0, count = Math.min(2048, samples.length - i); for (let j = 0; j < count; j++) sum += samples[i + j] ** 2; total += sum; windows.push(Math.sqrt(sum / count)); }
        fields.loudness.value = (20 * Math.log10(Math.max(Math.sqrt(total / samples.length), 0.000001))).toFixed(1);
        windows.sort((a, b) => a - b); const quiet = windows.slice(0, Math.max(1, Math.ceil(windows.length * .1))); const rms = quiet.reduce((a,b) => a + b, 0) / quiet.length;
        fields.noise.value = (20 * Math.log10(Math.max(rms, 0.000001))).toFixed(1); context.close();
      } catch (_) { /* Metadata remains available even if this browser cannot decode the codec. */ }
      URL.revokeObjectURL(url);
    }
    file.onchange = () => { if (file.files[0]) analysisPromise = analyse(file.files[0]); };
    form.addEventListener('submit', async (event) => { if (!file.files[0]) return; event.preventDefault(); submit.disabled = true; status.textContent = 'Saving and analysing audio...'; await analysisPromise; HTMLFormElement.prototype.submit.call(form); });
    record.onclick = async () => {
      if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({audio: true});
        recorder = new MediaRecorder(stream); chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
          stream.getTracks().forEach(track => track.stop());
          const blob = new Blob(chunks, {type: recorder.mimeType || 'audio/webm'});
          const recording = new File([blob], 'recording.webm', {type: blob.type});
          const transfer = new DataTransfer(); transfer.items.add(recording); file.files = transfer.files;
          analysisPromise = analyse(recording);
          preview.src = URL.createObjectURL(blob); preview.hidden = false; record.textContent = 'Start recording'; record.classList.remove('recording'); status.textContent = 'Recording ready to submit.';
        };
        recorder.start(); record.textContent = 'Stop recording'; record.classList.add('recording'); status.textContent = 'Recording…';
      } catch (_) { status.textContent = 'Microphone access was unavailable. Please upload an audio file instead.'; }
    };
  </script>
</main></body></html>
