services:
  - type: web
    name: consultbae-project
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: consultbae-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: consultbae-project.onrender.com

databases:
  - name: consultbae-db
    databaseName: consultbae
    user: consultbae
